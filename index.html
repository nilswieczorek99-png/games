<script>/* js/riddles.js */
/* Knobelkiste – Rätsel: Was ist das? */
(function () {
  'use strict';
  var KK = window.KK, h = KK.h;

  function stripArticle(s) {
    return s.trim().replace(/^(der|die|das|ein|eine|einen|dein|deine)\s+/i, '');
  }

  function lev(a, b) {
    var m = a.length, n = b.length, d = [];
    for (var i = 0; i <= m; i++) d[i] = [i];
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    return d[m][n];
  }

  function matches(guess, r) {
    var g = KK.normalize(stripArticle(guess));
    if (!g) return false;
    var all = [r.a].concat(r.alt || []);
    for (var i = 0; i < all.length; i++) {
      var t = KK.normalize(stripArticle(all[i]));
      if (g === t) return true;
      if (t.length >= 5 && lev(g, t) <= 1) return true; // kleiner Tippfehler ist okay
    }
    return false;
  }
  KK.riddleMatches = matches;

  function loadState() {
    var s = KK.store.get('raetsel.state', null);
    var n = KK.RIDDLES.length;
    if (!s || !s.deck || s.deck.length === 0 || s.size !== n) {
      s = { deck: KK.shuffle(Array.from({ length: n }, function (_, i) { return i; })), size: n, solved: s ? s.solved || 0 : 0, current: null };
    }
    return s;
  }

  var st = null;

  KK.modes.raetsel = {
    title: 'Rätsel',
    mount: function (root) {
      st = loadState();
      var card = h('section', { class: 'rt-card' });
      root.appendChild(card);

      function save() { KK.store.set('raetsel.state', st); }

      function show() {
        if (st.current === null || st.current === undefined) {
          if (!st.deck.length) st.deck = KK.shuffle(Array.from({ length: KK.RIDDLES.length }, function (_, i) { return i; }));
          st.current = st.deck.shift();
          st.hint = false; st.over = false;
          save();
        }
        var r = KK.RIDDLES[st.current];
        card.innerHTML = '';
        var left = st.deck.length;
        card.appendChild(h('p', { class: 'rt-meta', text: st.solved + ' gelöst, noch ' + left + ' im Stapel' }));
        card.appendChild(h('blockquote', { class: 'rt-q', text: r.q }));

        var input = h('input', {
          class: 'rt-input', type: 'text', placeholder: 'Deine Antwort', autocomplete: 'off',
          autocapitalize: 'sentences', spellcheck: 'false', enterkeyhint: 'done', 'aria-label': 'Antwort'
        });
        var feedback = h('p', { class: 'rt-feedback', 'aria-live': 'polite' });
        var hintEl = h('p', { class: 'rt-hint' });
        if (st.hint) hintEl.textContent = hintText(r);

        var form = h('form', { class: 'rt-form', onsubmit: function (e) { e.preventDefault(); guess(); } }, [
          input, h('button', { class: 'btn primary', type: 'submit', text: 'Prüfen' })
        ]);
        var tools = h('div', { class: 'rt-tools' }, [
          h('button', { class: 'tool', text: 'Tipp', onclick: function () {
            if (st.over) return;
            st.hint = true; save(); hintEl.textContent = hintText(r);
          } }),
          h('button', { class: 'tool', text: 'Auflösen', onclick: function () { finish(false); } }),
          h('button', { class: 'tool', text: 'Überspringen', onclick: function () {
            st.deck.push(st.current); st.current = null; save(); show();
          } })
        ]);

        card.appendChild(hintEl);
        card.appendChild(form);
        card.appendChild(feedback);
        card.appendChild(tools);

        function guess() {
          if (st.over) return;
          var g = input.value;
          if (!g.trim()) { input.focus(); return; }
          if (matches(g, r)) finish(true);
          else {
            feedback.className = 'rt-feedback bad';
            feedback.textContent = '„' + g.trim() + '“ ist es nicht. Noch mal überlegen?';
            input.select();
            KK.vibrate(80);
          }
        }

        function finish(ok) {
          st.over = true;
          var pts = ok ? (st.hint ? 1 : 3) : 0;
          if (ok) { st.solved++; KK.points.add('raetsel', pts); }
          st.current = null; save();
          form.remove(); tools.remove(); hintEl.remove();
          feedback.className = 'rt-feedback ' + (ok ? 'ok' : 'neutral');
          feedback.innerHTML = '';
          feedback.appendChild(document.createTextNode(ok ? 'Richtig! +' + pts + ' Punkt' + (pts > 1 ? 'e' : '') : 'Die Lösung:'));
          card.appendChild(h('p', { class: 'rt-answer', text: r.a }));
          if (r.note) card.appendChild(h('p', { class: 'rt-note', text: r.note }));
          var nextBtn = h('button', { class: 'btn primary wide', text: 'Nächstes Rätsel', onclick: show });
          card.appendChild(nextBtn);
          nextBtn.focus({ preventScroll: true });
        }
      }

      function hintText(r) {
        var a = r.a;
        return 'Tipp: beginnt mit „' + a[0].toUpperCase() + '“ und hat ' + a.replace(/\s/g, '').length + ' Buchstaben. (Richtig gibt dann 1 statt 3 Punkte.)';
      }

      root.appendChild(h('p', { class: 'hint-small', text: '3 Punkte ohne Tipp, 1 Punkt mit Tipp. Kleine Tippfehler werden verziehen.' }));
      show();
    },
    unmount: function () {}
  };
})();

</script>
<script>/* js/hangman.js */
/* Knobelkiste – Galgenmännchen gegen den Computer */
(function () {
  'use strict';
  var KK = window.KK, h = KK.h;
  var LIVES = 10;

  // Teile der Zeichnung, einer pro Fehlversuch
  var PARTS = [
    '<line x1="10" y1="150" x2="90" y2="150"/>',
    '<line x1="30" y1="150" x2="30" y2="12"/>',
    '<line x1="30" y1="12" x2="100" y2="12"/>',
    '<line x1="30" y1="38" x2="56" y2="12"/>',
    '<line x1="100" y1="12" x2="100" y2="34"/>',
    '<circle cx="100" cy="46" r="12"/>',
    '<line x1="100" y1="58" x2="100" y2="102"/>',
    '<line x1="100" y1="70" x2="82" y2="88"/><line x1="100" y1="70" x2="118" y2="88"/>',
    '<line x1="100" y1="102" x2="86" y2="128"/>',
    '<line x1="100" y1="102" x2="114" y2="128"/>'
  ];

  // Wörter aus dem Kreuzworträtsel, ohne umschriebene Umlaute (BRUECKE sieht hier komisch aus)
  function wordPool() {
    return KK.WORDS.filter(function (w) {
      return w[0].length >= 5 && !/AE|OE|[^EQ]UE/.test(w[0]);
    });
  }

  var st = null, root = null;

  function save() { KK.store.set('galgen.game', st); }

  function newGame() {
    var pool = wordPool();
    var recent = (st && st.recent) || [];
    var w;
    do { w = pool[Math.floor(Math.random() * pool.length)]; } while (recent.indexOf(w[0]) >= 0 && recent.length < pool.length);
    recent = recent.concat(w[0]).slice(-40);
    st = { word: w[0], clue: w[1], guessed: [], wrong: 0, hint: false, over: false, won: false, recent: recent,
      wins: st ? st.wins || 0 : 0, losses: st ? st.losses || 0 : 0 };
    save();
  }

  function guess(ch) {
    if (st.over || st.guessed.indexOf(ch) >= 0) return;
    st.guessed.push(ch);
    if (st.word.indexOf(ch) < 0) { st.wrong++; KK.vibrate(60); }
    var solved = st.word.split('').every(function (c) { return st.guessed.indexOf(c) >= 0; });
    if (solved) {
      st.over = true; st.won = true; st.wins++;
      var left = LIVES - st.wrong;
      st.earned = Math.max(1, 1 + Math.ceil(left / 3) - (st.hint ? 1 : 0));
      KK.points.add('galgen', st.earned);
      KK.vibrate([60, 40, 60]);
    } else if (st.wrong >= LIVES) {
      st.over = true; st.won = false; st.losses++;
    }
    save(); draw();
  }

  function draw() {
    if (!root) return;
    var svg = root.querySelector('.hg-svg');
    // nur neue Teile anhängen, damit nur der neue Strich eingeblendet wird
    if (svg.childElementCount > st.wrong) svg.innerHTML = '';
    var have = +(svg.getAttribute('data-n') || 0);
    if (svg.childElementCount === 0) have = 0;
    for (var i = have; i < st.wrong; i++) svg.insertAdjacentHTML('beforeend', '<g>' + PARTS[i] + '</g>');
    svg.setAttribute('data-n', st.wrong);
    root.querySelector('.hg-lives').textContent = st.over ? '' : (LIVES - st.wrong) + ' Fehlversuche übrig';
    root.querySelector('.hg-score').textContent = st.wins + ' gewonnen, ' + st.losses + ' verloren';

    var wordEl = root.querySelector('.hg-word');
    wordEl.innerHTML = '';
    st.word.split('').forEach(function (c) {
      var shown = st.guessed.indexOf(c) >= 0;
      var cls = 'hg-letter' + (shown ? ' shown' : '') + (st.over && !shown ? ' missed' : '');
      wordEl.appendChild(h('span', { class: cls, text: shown || st.over ? c : '' }));
    });
    wordEl.setAttribute('aria-label', st.over ? st.word : st.word.split('').map(function (c) { return st.guessed.indexOf(c) >= 0 ? c : 'Lücke'; }).join(' '));

    var hintEl = root.querySelector('.hg-hint');
    hintEl.textContent = st.hint || st.over ? 'Hinweis: ' + st.clue : '';
    root.querySelector('.hg-hintbtn').hidden = st.hint || st.over;

    root.querySelectorAll('.kb-key').forEach(function (k) {
      var ch = k.getAttribute('data-k');
      var used = st.guessed.indexOf(ch) >= 0;
      k.disabled = used || st.over;
      k.classList.toggle('hit', used && st.word.indexOf(ch) >= 0);
      k.classList.toggle('miss', used && st.word.indexOf(ch) < 0);
    });

    var res = root.querySelector('.hg-result');
    res.hidden = !st.over;
    if (st.over) {
      res.className = 'hg-result ' + (st.won ? 'won' : 'lost');
      res.querySelector('h3').textContent = st.won ? 'Gerettet!' : 'Hängt.';
      res.querySelector('p').textContent = st.won
        ? '+' + st.earned + ' Punkt' + (st.earned > 1 ? 'e' : '') + ', mit ' + st.wrong + ' Fehler' + (st.wrong === 1 ? '' : 'n')
        : 'Das Wort war ' + st.word + '.';
    }
  }

  function onKey(e) {
    if (!st || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[a-zA-Z]$/.test(e.key)) { guess(e.key.toUpperCase()); e.preventDefault(); }
    else if (e.key === 'Enter' && st.over) { newGame(); draw(); }
  }

  KK.modes.galgen = {
    title: 'Galgenmännchen',
    mount: function (r) {
      root = r;
      r.appendChild(h('p', { class: 'hg-score' }));
      r.appendChild(h('div', { class: 'hg-stage' }, [
        h('div', { class: 'hg-draw', html: '<svg class="hg-svg" viewBox="0 0 130 160" aria-hidden="true"></svg>' }),
        h('p', { class: 'hg-lives' })
      ]));
      r.appendChild(h('div', { class: 'hg-word', role: 'img' }));
      r.appendChild(h('p', { class: 'hg-hint' }));
      r.appendChild(h('div', { class: 'hg-result', hidden: true }, [
        h('h3', {}), h('p', {}),
        h('button', { class: 'btn primary', text: 'Neues Wort', onclick: function () { newGame(); draw(); } })
      ]));
      var kb = h('div', { class: 'kb hg-kb', 'aria-label': 'Buchstaben' });
      ['QWERTZUIOP', 'ASDFGHJKL', 'YXCVBNM'].forEach(function (row) {
        var rowEl = h('div', { class: 'kb-row' });
        row.split('').forEach(function (ch) {
          rowEl.appendChild(h('button', { class: 'kb-key', 'data-k': ch, text: ch, onclick: function () { guess(ch); } }));
        });
        kb.appendChild(rowEl);
      });
      r.appendChild(kb);
      r.appendChild(h('div', { class: 'hg-tools' }, [
        h('button', { class: 'tool hg-hintbtn', text: 'Hinweis zeigen (−1 Punkt)', onclick: function () { st.hint = true; save(); draw(); } }),
        h('button', { class: 'tool', text: 'Neues Wort', onclick: function () {
          if (!st.over && st.guessed.length && !window.confirm('Dieses Wort aufgeben?')) return;
          if (!st.over && st.guessed.length) { st.losses++; }
          newGame(); draw();
        } })
      ]));
      st = KK.store.get('galgen.game', null);
      if (!st || !st.word) newGame();
      draw();
      document.addEventListener('keydown', onKey);
    },
    unmount: function () { document.removeEventListener('keydown', onKey); root = null; }
  };
})();

</script>
<script>/* js/brands.js */
/* Knobelkiste – Markenraten mit drei Hinweisen */
(function () {
  'use strict';
  var KK = window.KK, h = KK.h;
  var POINTS = [3, 2, 1];

  function freshDeck() { return KK.shuffle(Array.from({ length: KK.BRANDS.length }, function (_, i) { return i; })); }

  function loadState() {
    var s = KK.store.get('marken.state', null);
    if (!s || !s.deck || s.size !== KK.BRANDS.length) {
      s = { deck: freshDeck(), size: KK.BRANDS.length, solved: s ? s.solved || 0 : 0, current: null };
    }
    return s;
  }

  KK.modes.marken = {
    title: 'Markenraten',
    mount: function (root) {
      var st = loadState();
      var card = h('section', { class: 'rt-card mk-card' });
      root.appendChild(card);
      root.appendChild(h('p', { class: 'hint-small', text: 'Richtig nach dem 1. Hinweis: 3 Punkte, nach dem 2.: 2, nach dem 3.: 1.' }));

      function save() { KK.store.set('marken.state', st); }

      function show() {
        if (st.current === null || st.current === undefined) {
          if (!st.deck.length) st.deck = freshDeck();
          st.current = st.deck.shift();
          st.shown = 1;
          save();
        }
        var b = KK.BRANDS[st.current];
        var item = { a: b.a, alt: b.alt };
        card.innerHTML = '';
        card.appendChild(h('p', { class: 'rt-meta', text: st.solved + ' erraten, noch ' + st.deck.length + ' im Stapel' }));
        card.appendChild(h('h2', { class: 'mk-ask', text: 'Welche Marke ist gesucht?' }));
        var list = h('ol', { class: 'mk-hints' });
        card.appendChild(list);

        function renderHints() {
          list.innerHTML = '';
          b.h.forEach(function (txt, i) {
            var open = i < st.shown;
            list.appendChild(h('li', { class: open ? 'open' : 'locked' }, [
              h('span', { class: 'mk-pts', text: POINTS[i] + ' P' }),
              h('span', { class: 'mk-txt', text: open ? txt : 'Noch verdeckt' })
            ]));
          });
          moreBtn.hidden = st.shown >= b.h.length;
        }

        var input = h('input', {
          class: 'rt-input', type: 'text', placeholder: 'Markenname', autocomplete: 'off',
          autocapitalize: 'words', spellcheck: 'false', enterkeyhint: 'done', 'aria-label': 'Markenname'
        });
        var feedback = h('p', { class: 'rt-feedback', 'aria-live': 'polite' });
        var form = h('form', { class: 'rt-form', onsubmit: function (e) { e.preventDefault(); guess(); } }, [
          input, h('button', { class: 'btn primary', type: 'submit', text: 'Prüfen' })
        ]);
        var moreBtn = h('button', { class: 'tool', text: 'Nächster Hinweis', onclick: function () {
          st.shown = Math.min(b.h.length, st.shown + 1); save(); renderHints();
        } });
        var tools = h('div', { class: 'rt-tools mk-tools' }, [
          moreBtn,
          h('button', { class: 'tool', text: 'Auflösen', onclick: function () { finish(false); } })
        ]);
        card.appendChild(form);
        card.appendChild(feedback);
        card.appendChild(tools);
        renderHints();

        function guess() {
          var g = input.value;
          if (!g.trim()) { input.focus(); return; }
          if (KK.riddleMatches(g, item)) { finish(true); return; }
          feedback.className = 'rt-feedback bad';
          if (st.shown < b.h.length) {
            st.shown++; save(); renderHints();
            feedback.textContent = '„' + g.trim() + '“ ist es nicht. Hier ist der nächste Hinweis.';
          } else {
            feedback.textContent = '„' + g.trim() + '“ ist es nicht. Noch ein Versuch?';
          }
          input.select();
          KK.vibrate(80);
        }

        function finish(ok) {
          var pts = ok ? POINTS[st.shown - 1] : 0;
          if (ok) { st.solved++; KK.points.add('marken', pts); }
          st.current = null; save();
          st.shown = b.h.length; renderHints();
          form.remove(); tools.remove();
          feedback.className = 'rt-feedback ' + (ok ? 'ok' : 'neutral');
          feedback.textContent = ok ? 'Richtig! +' + pts + ' Punkt' + (pts > 1 ? 'e' : '') : 'Gesucht war:';
          card.appendChild(h('p', { class: 'rt-answer', text: b.a }));
          var nextBtn = h('button', { class: 'btn primary wide', text: 'Nächste Marke', onclick: show });
          card.appendChild(nextBtn);
          nextBtn.focus({ preventScroll: true });
        }
      }
      show();
    },
    unmount: function () {}
  };
})();

</script>
<script>/* js/app.js */
/* Knobelkiste – Navigation zwischen den Bereichen */
(function () {
  'use strict';
  var KK = window.KK;
  var view = document.getElementById('view');
  var titleEl = document.getElementById('title');
  var backBtn = document.getElementById('backBtn');
  var current = null;
  var depth = 0; // wie viele Schritte wir innerhalb der App navigiert sind

  function parse() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean);
    return { mode: parts[0] || 'home', sub: parts[1] || '' };
  }

  function render() {
    var r = parse();
    var mode = KK.modes[r.mode] || KK.modes.home;
    if (current && current.unmount) {
      try { current.unmount(); } catch (e) { /* weiter */ }
    }
    view.innerHTML = '';
    view.className = 'view view-' + (KK.modes[r.mode] ? r.mode : 'home');
    current = mode;
    var title = typeof mode.title === 'function' ? mode.title(r.sub) : mode.title;
    titleEl.textContent = title || 'Knobelkiste';
    document.title = r.mode === 'home' ? 'Knobelkiste' : title + ' – Knobelkiste';
    backBtn.hidden = r.mode === 'home';
    mode.mount(view, r.sub);
    window.scrollTo(0, 0);
    KK.renderTotal();
  }

  KK.go = function (path) {
    depth++;
    location.hash = '#/' + path;
  };

  backBtn.addEventListener('click', function () {
    if (depth > 0) { depth--; history.back(); }
    else {
      var r = parse();
      location.replace('#/' + (r.sub ? r.mode : ''));
    }
  });

  window.addEventListener('hashchange', render);
  render();

  // Offline-Fähigkeit (nur über http/https, nicht in der APK)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* egal */ });
    });
  }
})();

</script>
